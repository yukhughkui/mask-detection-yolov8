<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口罩实时检测 · YOLOv8n</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #2c2c2a; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  .card {
    background: #fff; border-radius: 14px; max-width: 720px; width: 100%;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden;
  }
  header { padding: 22px 24px 14px; }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { font-size: 13px; color: #888780; margin-top: 6px; line-height: 1.6; }
  .stage { position: relative; background: #1c1c1a; min-height: 240px; }
  canvas { display: block; width: 100%; height: auto; }
  .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #b4b2a9; font-size: 14px; letter-spacing: .5px; text-align: center; padding: 20px;
  }
  .hidden { display: none !important; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 24px 22px; }
  button, label.btn {
    border: none; border-radius: 9px; padding: 10px 18px; font-size: 14px; cursor: pointer;
    background: #2c2c2a; color: #fff; transition: opacity .15s;
  }
  button:disabled, .btn-disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: #f1efe8; color: #444441; }
  input[type=file] { display: none; }
  .legend { display: flex; gap: 18px; padding: 0 24px 18px; font-size: 12.5px; color: #5f5e5a; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .fps { position: absolute; top: 10px; left: 10px; color: #d3d1c7; font-size: 12px;
         font-family: Consolas, monospace; text-shadow: 0 1px 2px #000; }
  footer { font-size: 12px; color: #888780; margin-top: 18px; line-height: 1.7; text-align: center; }
  a { color: #5f5e5a; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>口罩实时检测</h1>
    <div class="sub">YOLOv8n · 全部推理在你的浏览器本地完成，图像不会上传到任何服务器</div>
  </header>

  <div class="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div class="status" id="status">正在加载模型（约 13MB，首次稍等）……</div>
    <div class="fps hidden" id="fps"></div>
  </div>

  <div class="controls">
    <button id="btnCam">打开摄像头</button>
    <button id="btnStop" class="ghost" disabled>停止</button>
    <label class="btn" for="file">检测图片</label>
    <input type="file" id="file" accept="image/*">
  </div>

  <div class="legend">
    <span><span class="dot" style="background:#50dc50"></span>戴了口罩</span>
    <span><span class="dot" style="background:#ff3c3c"></span>没戴口罩</span>
  </div>
</div>

<footer>
  模型在 <a href="https://github.com/archie9211/Mask-Detection-Dataset" target="_blank">Mask-Detection-Dataset</a>
  （8214 张标注图）上训练 · 源码见
  <a href="https://github.com/yukhughkui/mask-detection-yolov8" target="_blank">GitHub 仓库</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<script>
const SIZE = 480, CONF = 0.4, IOU = 0.5;
const NAMES = ['mask', 'nomask'];
const COLORS = { mask: '#50dc50', nomask: '#ff3c3c' };
const LABELS = { mask: '戴口罩', nomask: '没戴口罩' };

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const statusEl = document.getElementById('status'), fpsEl = document.getElementById('fps');
const btnCam = document.getElementById('btnCam'), btnStop = document.getElementById('btnStop');
let session = null, video = null, stream = null, loopOn = false, busy = false, lastT = 0;

ort.env.wasm.numThreads = 1;   // 静态站点无跨域隔离，单线程最稳

(async () => {
  try {
    session = await ort.InferenceSession.create('best.onnx');
    statusEl.textContent = '模型就绪 —— 点「打开摄像头」或选一张图片';
  } catch (e) {
    statusEl.textContent = '模型加载失败：' + e.message;
  }
})();

function letterbox(w, h) {          // 返回 [scale, padLeft, padTop]
  const s = SIZE / Math.max(w, h);
  return [s, Math.round((SIZE - Math.round(w * s)) / 2), Math.round((SIZE - Math.round(h * s)) / 2)];
}

const inferCv = document.createElement('canvas');   // 固定 480×480 的离屏推理画布
inferCv.width = SIZE; inferCv.height = SIZE;
const ictx = inferCv.getContext('2d', { willReadFrequently: true });

function runInput(source, sw, sh) { // source: 画布或视频；sw/sh 源尺寸
  const [s, pl, pt] = letterbox(sw, sh);
  ictx.fillStyle = '#717171';
  ictx.fillRect(0, 0, SIZE, SIZE);
  ictx.drawImage(source, pl, pt, Math.round(sw * s), Math.round(sh * s));
  const px = ictx.getImageData(0, 0, SIZE, SIZE).data;
  const f = new Float32Array(3 * SIZE * SIZE);
  for (let i = 0; i < SIZE * SIZE; i++) {
    f[i]                  = px[i * 4]     / 255;  // R
    f[SIZE * SIZE + i]    = px[i * 4 + 1] / 255;  // G
    f[2 * SIZE * SIZE + i]= px[i * 4 + 2] / 255;  // B
  }
  const t0 = performance.now();
  session.run({ images: new ort.Tensor('float32', f, [1, 3, SIZE, SIZE]) }).then(out => {
    draw(out.output0.data, s, pl, pt, sw, sh, performance.now() - t0);
  });
}

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]), y1 = Math.max(a[1], b[1]);
  const x2 = Math.min(a[2], b[2]), y2 = Math.min(a[3], b[3]);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  const area = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
  return inter / area;
}

function draw(data, s, pl, pt, ow, oh, inferMs) {
  const N = 4725;
  const dets = [];
  for (let j = 0; j < N; j++) {
    const cx = data[j], cy = data[N + j], w = data[2*N + j], h = data[3*N + j];
    const c0 = data[4*N + j], c1 = data[5*N + j];
    const cls = c1 > c0 ? 1 : 0, score = Math.max(c0, c1);
    if (score < CONF) continue;
    const x1 = Math.max(0, (cx - w/2 - pl) / s), y1 = Math.max(0, (cy - h/2 - pt) / s);
    const x2 = Math.min(ow, (cx + w/2 - pl) / s), y2 = Math.min(oh, (cy + h/2 - pt) / s);
    dets.push([x1, y1, x2, y2, score, cls]);
  }
  dets.sort((a, b) => b[4] - a[4]);
  const keep = [];
  for (const d of dets) {
    if (keep.every(k => iou(k, d) < IOU)) keep.push(d);
  }
  // 画回展示画布
  const dispW = cv.width, dispScale = dispW / ow;
  ctx.fillStyle = '#717171';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(lastFrame, 0, 0, dispW, dispW * oh / ow);
  for (const [x1, y1, x2, y2, score, cls] of keep) {
    const name = NAMES[cls];
    const X1 = x1 * dispScale, Y1 = y1 * dispScale, X2 = x2 * dispScale, Y2 = y2 * dispScale;
    ctx.lineWidth = 3;
    ctx.strokeStyle = COLORS[name];
    ctx.strokeRect(X1, Y1, X2 - X1, Y2 - Y1);
    const text = LABELS[name] + ' ' + Math.round(score * 100) + '%';
    ctx.font = '600 17px "PingFang SC", "Microsoft YaHei", sans-serif';
    const tw = ctx.measureText(text).width + 14;
    const tagY = Y1 < 30 ? Y1 + 4 : Y1 - 28;   // 框贴着画布顶部时标签画进框内
    ctx.fillStyle = COLORS[name];
    ctx.fillRect(X1, tagY, tw, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, X1 + 7, tagY + 19);
  }
  if (loopOn) {
    const now = performance.now(), dt = (now - lastT) / 1000;
    lastT = now;
    fpsEl.textContent = 'FPS ' + (1 / Math.max(1e-6, dt)).toFixed(1) + '  ·  推理 ' + inferMs.toFixed(0) + ' ms';
  }
}

let lastFrame = null;   // 最近一帧（视频或图片），画框时垫底

function canvasFrom(source, sw, sh) {
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  c.getContext('2d').drawImage(source, 0, 0, sw, sh);
  return c;
}

async function camLoop() {
  if (!loopOn) return;
  if (!busy && video.videoWidth) {
    busy = true;
    const sw = video.videoWidth, sh = video.videoHeight;
    cv.width = 960; cv.height = Math.round(960 * sh / sw);
    lastFrame = canvasFrom(video, sw, sh);
    await runInput(video, sw, sh);
    busy = false;
  }
  setTimeout(camLoop, 30);
}

btnCam.onclick = async () => {
  if (!session) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280 } });
    video = document.createElement('video');
    video.srcObject = stream;
    await video.play();
    statusEl.classList.add('hidden');
    fpsEl.classList.remove('hidden');
    loopOn = true; lastT = performance.now();
    btnCam.disabled = true; btnStop.disabled = false;
    camLoop();
  } catch (e) {
    statusEl.textContent = '打不开摄像头：' + e.message + '（也可以用「检测图片」）';
    statusEl.classList.remove('hidden');
  }
};

btnStop.onclick = () => {
  loopOn = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video = null;
  statusEl.textContent = '已停止 —— 点「打开摄像头」重来，或选一张图片';
  statusEl.classList.remove('hidden');
  fpsEl.classList.add('hidden');
  btnCam.disabled = false; btnStop.disabled = true;
};

document.getElementById('file').onchange = e => {
  if (!session || !e.target.files.length) return;
  const img = new Image();
  img.onload = () => {
    const sw = img.naturalWidth, sh = img.naturalHeight;
    cv.width = Math.min(960, sw);
    cv.height = Math.round(cv.width * sh / sw);
    lastFrame = canvasFrom(img, sw, sh);
    statusEl.classList.add('hidden');
    fpsEl.classList.add('hidden');
    runInput(img, sw, sh);
  };
  img.src = URL.createObjectURL(e.target.files[0]);
  e.target.value = '';
};
</script>
</body>
</html>
